{% extends "base.html" %}

{% block content %}
<div class="retro-landing">
    <div class="retro-container">
        <h1 class="retro-title text-center">Register</h1>
        <div class="auth-container">
            <div class="wrapper">
                <div class="switch">
                    <div class="card-side">
                        <a href="{{ url_for('login') }}" class="retro-btn outline">Log in</a>
                        <a href="{{ url_for('register') }}" class="retro-btn">Sign up</a>
                    </div>
                </div>
                <div class="auth-card">
                    <form method="POST" class="auth-form">
                        <input type="text" class="flip-card__input" id="username" name="username" placeholder="Username" required>
                        <input type="password" class="flip-card__input" id="password" name="password" placeholder="Password" required>
                        <button type="submit" class="retro-btn">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
