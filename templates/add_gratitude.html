{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Add Gratitude Entry</h2>
    <form method="POST" id="gratitude-form">
        <div class="mb-3">
            <label for="content" class="form-label">What are you grateful for today?</label>
            <textarea class="form-control" id="content" name="content" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Save Entry</button>
        <a href="{{ url_for('gratitude_wall') }}" class="btn btn-secondary">Back to Gratitude Wall</a>
    </form>
</div>
{% endblock %}
